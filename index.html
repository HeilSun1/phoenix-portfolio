<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>吴天豪 HeilSun — 求职 菲尼克斯电气校园大使 作品集</title>
<meta name="description" content="吴天豪（HeilSun）· 求职菲尼克斯电气校园大使。测控技术与仪器在读工科生：B 站 51 支原创 / 107 万播放；中甲、苏超两段职业赛事现场一线协调。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0b0e'/%3E%3Ccircle cx='10' cy='10' r='6' fill='none' stroke='%2322a552' stroke-width='2.4'/%3E%3Ccircle cx='21' cy='17' r='8.4' fill='%2322a552'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0a0b0e; --bg2:#0e1016; --panel:#12141b; --panel2:#171a23;
  --line:#23262f; --line2:#323744;
  --txt:#eef1f6; --mut:#98a1b1; --dim:#5d6470;
  --blue:#22a552; --blue-hi:#62e09a; --blue-bg:rgba(34,165,82,.14);
  --red:#ff3b30;
  --max:1120px;
  --mono:ui-monospace,"SF Mono","Cascadia Code",Consolas,"Courier New",monospace;
  --sans:"PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei UI","Microsoft YaHei",-apple-system,"Segoe UI",Roboto,sans-serif;
  --w8:800; --w9:900;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:rgba(34,165,82,.45);color:#fff}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
.wrap{max-width:var(--max);margin:0 auto;padding:0 30px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.blue{color:var(--blue-hi)}
section{scroll-margin-top:72px}

/* ---------- 顶栏 ---------- */
nav{position:sticky;top:0;z-index:60;background:rgba(10,11,14,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav .in{max-width:var(--max);margin:0 auto;padding:0 30px;height:62px;display:flex;align-items:center;gap:28px}
.nb{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.nb b{font-size:17px;font-weight:900;letter-spacing:.01em}
.nb span{font-family:var(--mono);font-size:12px;color:var(--blue-hi);letter-spacing:.14em}
nav .ln{margin-left:auto;display:flex;gap:26px;font-size:14.5px;color:var(--mut)}
nav .ln a{transition:color .18s}
nav .ln a:hover{color:#fff}
nav .ln a.on{color:#fff}
nav .ln a.on::after{content:"";display:block;height:2px;background:var(--blue);margin-top:2px}
.tc{font-family:var(--mono);font-size:12.5px;color:var(--dim);display:flex;align-items:center;gap:8px;white-space:nowrap}
.tc .r{width:7px;height:7px;border-radius:50%;background:var(--blue-hi);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:.15}}
@media(max-width:920px){nav .ln{display:none}}

/* ---------- HERO ---------- */
.hero{min-height:calc(100vh - 62px);display:grid;align-content:center;position:relative;padding:110px 0 64px;overflow:hidden}
.hero > .wrap + .wrap{margin-top:56px}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:1px;background:linear-gradient(90deg,transparent,var(--line2),transparent)}
.bg-grid{position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:56px 56px;
  mask-image:radial-gradient(120% 90% at 50% 0%,#000 20%,transparent 72%);-webkit-mask-image:radial-gradient(120% 90% at 50% 0%,#000 20%,transparent 72%)}
.hgrid{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:64px;align-items:center}
@media(max-width:1240px){.hgrid{grid-template-columns:minmax(0,1fr) 360px;gap:40px}}
.eyebrow{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;letter-spacing:.18em;color:var(--blue-hi)}
.eyebrow::before{content:"";width:26px;height:2px;background:var(--blue)}
h1{font-size:clamp(56px,9vw,118px);line-height:.95;font-weight:900;color:#fff;letter-spacing:-.02em;margin:26px 0 6px;white-space:nowrap}
h1 .en{font-family:var(--mono);font-size:.30em;font-weight:400;color:var(--blue-hi);letter-spacing:.18em;display:block;margin-top:14px;white-space:normal}
.deck{margin-top:18px;font-size:clamp(19px,2.6vw,26px);font-weight:800;color:#fff;line-height:1.45;max-width:24em}
.deck b{color:var(--blue-hi)}
.lead{margin-top:16px;color:var(--mut);max-width:46em;font-size:15px}
.acts{display:flex;gap:14px;margin-top:34px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:9px;padding:14px 24px;font-size:15px;font-weight:800;transition:.18s;cursor:pointer;letter-spacing:.02em}
.btn svg{width:15px;height:15px}
.btn.blue{background:var(--blue);color:#fff}
.btn.blue:hover{background:var(--blue-hi)}
.btn.line{border:1px solid var(--line2);color:var(--txt)}
.btn.line:hover{border-color:var(--blue);color:var(--blue-hi);background:var(--blue-bg)}
.crew{border:1px solid var(--line2);background:var(--bg2);position:relative}
.crew .head{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--line2);background:var(--panel);font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;color:var(--dim)}
.crew .head i{width:8px;height:8px;background:var(--blue);display:block}
.crew .head .tag{margin-left:auto;color:var(--blue-hi)}
.crew .rows{padding:4px 0}
.cr{display:grid;grid-template-columns:76px 1fr;padding:11px 18px;border-bottom:1px solid var(--line);font-size:14px;gap:8px}
.cr:last-child{border-bottom:0}
.cr .k{color:var(--dim);font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;padding-top:2px}
.cr .v{color:#e6eaf2;font-weight:600}
.cr .v a{border-bottom:1px solid rgba(98,224,154,.5);color:var(--blue-hi)}
.cr .v a:hover{border-color:var(--blue-hi)}
.cr .v small{display:block;color:var(--dim);font-weight:400;font-size:12px;margin-top:1px}
.crew .foot{padding:15px 18px;border-top:1px solid var(--line2);display:flex;gap:10px}
.crew .foot .btn{padding:10px 14px;font-size:13px;flex:1;justify-content:center}
.stats{margin-top:44px;border:1px solid var(--line);background:var(--panel);display:flex;flex-wrap:wrap;position:relative}
.stats .s{flex:1;min-width:150px;padding:18px 22px;border-left:1px solid var(--line)}
.stats .s:first-child{border-left:0}
.stats .s .v{font-family:var(--mono);font-size:26px;font-weight:700;color:#fff;letter-spacing:.01em}
.stats .s .v b{color:var(--blue-hi);font-weight:700}
.stats .s .l{font-size:12px;color:var(--dim);margin-top:4px;letter-spacing:.04em}
@media(max-width:1020px){.hgrid{grid-template-columns:1fr;gap:44px}.hero{min-height:auto}}

/* ---------- 区块 ---------- */
.sec{padding:88px 0 84px;border-bottom:1px solid var(--line)}
.sec.alt{background:var(--bg2)}
.shead{margin-bottom:14px}
.shead .sc{font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--blue-hi);display:flex;align-items:center;gap:12px}
.shead .sc i{width:34px;height:1px;background:var(--line2)}
.shead h2{font-size:clamp(30px,4.6vw,52px);font-weight:900;color:#fff;line-height:1.06;margin-top:12px;letter-spacing:-.01em}
.shead h2 em{font-style:normal;color:var(--blue-hi)}
.sintro{color:var(--mut);max-width:60em;margin-top:12px;font-size:15px}
.sintro b{color:#fff}

/* ---------- 作品 SC-01 ---------- */
.film{display:flex;flex-direction:column;margin-top:40px}
.frow{display:grid;grid-template-columns:66px 156px 1fr auto;gap:22px;align-items:center;padding:18px 4px;border-bottom:1px solid var(--line);position:relative;transition:background .2s}
.frow:hover{background:var(--panel)}
.frow .idx{font-family:var(--mono);color:var(--dim);font-size:13px;text-align:right;line-height:1.4}
.frow .idx b{display:block;color:var(--blue-hi);font-weight:600;font-size:12px;letter-spacing:.1em}
.fthumb{position:relative;width:156px;aspect-ratio:16/10;overflow:hidden;background:#0d0f15;border:1px solid var(--line)}
.fthumb .pl{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);font-size:22px;background:linear-gradient(160deg,#0d1017,#0a0b0e)}
.fthumb img{width:100%;height:100%;object-fit:cover;opacity:0;transition:.4s}
.fthumb img.ok{opacity:1}
.fthumb.on .pl{display:none}
.fthumb .pl{transition:opacity .25s}
.frow:hover .fthumb .pl{color:var(--blue-hi)}
.frow:hover .fthumb{box-shadow:inset 0 0 0 2px var(--blue)}
.fmain h3{font-size:17.5px;font-weight:800;color:#fff;line-height:1.4;letter-spacing:.01em}
.fmain .sub{display:flex;gap:14px;margin-top:6px;font-size:12px;color:var(--dim);font-family:var(--mono);letter-spacing:.03em;flex-wrap:wrap}
.fmain .sub .t{color:var(--blue-hi)}
.fnote{font-size:13px;color:var(--dim);margin-top:6px;max-width:56em;line-height:1.6}
.fmeta{text-align:right;font-family:var(--mono);display:flex;flex-direction:column;gap:2px;align-items:flex-end;white-space:nowrap}
.fmeta .pl{font-size:20px;font-weight:700;color:#fff}
.fmeta .pl b{color:var(--blue-hi)}
.fmeta .cm{font-size:11.5px;color:var(--dim)}
.fall{margin-top:34px;display:inline-flex;align-items:center;gap:10px;font-weight:800;color:var(--blue-hi);font-size:15px}
.fall:hover{color:#fff}
@media(max-width:840px){.frow{grid-template-columns:1fr;gap:12px;padding:20px}.frow .idx{text-align:left;display:flex;gap:16px;align-items:baseline}.fthumb{width:100%;aspect-ratio:16/8}.fmeta{flex-direction:row;gap:18px;align-items:baseline}}

/* ---------- 系列 SC-02 ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:40px}
.scard{border:1px solid var(--line);background:var(--panel);padding:26px 24px 22px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden;transition:.22s}
.scard:hover{border-color:var(--blue);transform:translateY(-3px)}
.scard::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--blue);opacity:0;transition:.2s}
.scard:hover::before{opacity:1}
.scard .no{font-family:var(--mono);color:var(--blue-hi);font-size:14px;letter-spacing:.1em}
.scard .no em{color:var(--dim);font-style:normal;font-size:11px;letter-spacing:.08em;margin-left:8px}
.scard h3{font-size:19px;font-weight:800;color:#fff;line-height:1.35}
.scard .pill{font-size:11.5px;color:var(--blue-hi);background:var(--blue-bg);border:1px solid rgba(34,165,82,.4);padding:2px 10px;letter-spacing:.05em;font-weight:700;align-self:flex-start;border-radius:99px}
.scard p{font-size:13.5px;color:var(--mut);line-height:1.7}
.scard .eps{margin-top:auto;border-top:1px solid var(--line);padding-top:13px;display:flex;flex-direction:column;gap:8px}
.scard .eps a{font-size:13px;color:var(--mut);display:flex;gap:8px;align-items:baseline;transition:.15s}
.scard .eps a:hover{color:var(--blue-hi)}
.scard .eps a .n{font-family:var(--mono);color:var(--dim);font-size:11px;margin-left:auto}
.scard .eps a .pv{color:var(--dim)}
@media(max-width:1000px){.sgrid{grid-template-columns:1fr}}

/* ---------- 经历 SC-03 ---------- */
.expgrid{display:grid;grid-template-columns:1fr 1fr;gap:48px;margin-top:44px;align-items:start}
.ev{border:1px solid var(--line);border-left:3px solid var(--blue);background:var(--panel);padding:20px 24px;margin-bottom:16px}
.ev .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.ev h4{font-size:17px;font-weight:800;color:#fff;line-height:1.4}
.ev h4 small{display:block;color:var(--dim);font-weight:500;font-size:12.5px;margin-top:4px}
.ev .dt{font-family:var(--mono);color:var(--blue-hi);font-size:13px;white-space:nowrap;font-weight:700}
.ev p{padding-top:10px;font-size:14px;color:var(--mut)}
.ev p b{color:#e6eaf2}
.flow{border:1px solid var(--line);background:var(--panel);padding:24px}
.flow h4{font-size:16px;font-weight:800;color:#fff;display:flex;align-items:center;gap:10px;margin-bottom:6px}
.flow h4 .ic{color:var(--blue-hi)}
.flow .st{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.1em;margin-bottom:16px;display:block}
.flow ol{list-style:none;counter-reset:fl}
.flow li{counter-increment:fl;display:flex;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);align-items:baseline}
.flow li:last-child{border-bottom:0}
.flow li::before{content:counter(fl,decimal-leading-zero);font-family:var(--mono);color:var(--blue);font-size:12px;min-width:20px}
.flow li .tt{font-weight:600;color:#e6eaf2;font-size:14px;min-width:88px}
.flow li .ds{color:var(--mut);font-size:13px}
.note-sm{font-size:12px;color:var(--dim);margin-top:16px;line-height:1.7}
.note-sm b{color:#fff}
@media(max-width:900px){.expgrid{grid-template-columns:1fr}}

/* ---------- 档案 SC-04 ---------- */
.abgrid{display:grid;grid-template-columns:250px 1fr;gap:52px;margin-top:40px;align-items:start}
.portrait{border:1px solid var(--line2);background:var(--panel);position:relative}
.portrait .ph{aspect-ratio:4/4.4;overflow:hidden;background:var(--bg2)}
.portrait .ph img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.04)}
.portrait .cap{display:flex;justify-content:space-between;gap:10px;padding:11px 14px;border-top:1px solid var(--line2);font-family:var(--mono);font-size:12px;color:var(--mut)}
.portrait .cap b{color:#fff}
.skl h3{font-size:22px;font-weight:900;color:#fff;margin-bottom:4px;letter-spacing:.01em}
.skl .who{font-size:13.5px;color:var(--dim);margin-bottom:22px}
.sk{display:grid;grid-template-columns:1fr 1fr;gap:0 40px}
.sk li{list-style:none;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px;display:flex;gap:12px}
.sk li .t{color:var(--blue-hi);font-family:var(--mono);font-size:11px;letter-spacing:.08em;padding-top:3px;white-space:nowrap}
.sk li b{color:#e6eaf2}
.stmt{margin-top:30px;border:1px solid var(--blue);background:var(--blue-bg);padding:20px 24px;font-size:15px;color:#dfe7f5;line-height:1.85;border-radius:4px}
.stmt b{color:#fff}
@media(max-width:900px){.abgrid{grid-template-columns:1fr;gap:36px}.portrait{max-width:240px}.sk{grid-template-columns:1fr}}

/* ---------- 联系 SC-05 ---------- */
.cta-big{font-size:clamp(34px,6vw,64px);font-weight:900;color:#fff;line-height:1.08;margin-top:10px;letter-spacing:-.01em;white-space:pre-line}
.cta-big em{font-style:normal;color:var(--blue-hi)}
.ccells{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:44px}
.cc{border:1px solid var(--line);background:var(--panel);padding:22px;display:flex;flex-direction:column;gap:10px;transition:.2s}
.cc:hover{border-color:var(--blue)}
.cc .k{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.14em}
.cc .v{font-size:16px;font-weight:800;color:#fff;word-break:break-all}
.cc .v a{border-bottom:1px solid rgba(98,224,154,.45)}
.cc .v a:hover{color:var(--blue-hi);border-color:var(--blue-hi)}
.cc .go{font-family:var(--mono);color:var(--dim);font-size:12px;margin-top:auto}
.cc:hover .go{color:var(--blue-hi)}
@media(max-width:1000px){.ccells{grid-template-columns:repeat(2,1fr)}}
footer{border-top:1px solid var(--line);background:var(--bg2);padding:26px 0}
footer .wrap{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:11.5px;color:var(--dim)}
footer a{border-bottom:1px dotted var(--dim)}
footer a:hover{color:var(--blue-hi)}
.rv{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>
<body>

<nav>
  <div class="in">
    <div class="nb"><b id="nbName">吴天豪</b><span>PHOENIX CONTACT</span></div>
    <div class="ln">
      <a href="#works">内容</a>
      <a href="#series">长线</a>
      <a href="#field">现场</a>
      <a href="#about">档案</a>
      <a href="#contact">联系</a>
    </div>
    <div class="tc"><span class="r"></span><span id="tc">00:00:00:00</span></div>
  </div>
</nav>

<!-- ============ HERO ============ -->
<header class="hero">
  <div class="bg-grid"></div>
  <div class="wrap hgrid">
    <div>
      <div class="eyebrow" id="eyebrow"></div>
      <h1><span id="heroName"></span><span class="en" id="heroNameEn"></span></h1>
      <p class="deck" id="deck"></p>
      <p class="lead" id="lead"></p>
      <div class="acts">
        <a class="btn blue" href="#works" id="btnMain"><span id="btnMainTxt">看作品</span> <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
        <a class="btn line" id="btnMail" href="mailto:2253421641@qq.com"><span id="btnMailTxt"></span> ↗</a>
        <a class="btn line" id="btnBili" target="_blank" rel="noopener"><span id="btnBiliTxt"></span> ↗</a>
      </div>
    </div>

    <aside class="crew">
      <div class="head"><i></i><span id="crewHead">CREW ID</span><span class="tag" id="crewTag"></span></div>
      <div class="rows" id="crewRows"></div>
      <div class="foot" id="crewFoot"></div>
    </aside>
  </div>

  <div class="wrap">
    <div class="stats" id="facts"></div>
  </div>
</header>

<!-- ============ 作品 ============ -->
<section class="sec" id="works">
  <div class="wrap">
    <div class="shead rv">
      <div class="sc"><i></i><span id="worksSc"></span></div>
      <h2 id="worksTitle"></h2>
      <p class="sintro" id="worksIntro"></p>
    </div>
    <div class="film" id="worksRows"></div>
    <a class="fall rv" id="worksMore" target="_blank" rel="noopener"></a>
  </div>
</section>

<!-- ============ 系列 ============ -->
<section class="sec alt" id="series">
  <div class="wrap">
    <div class="shead rv">
      <div class="sc"><i></i><span id="seriesSc"></span></div>
      <h2 id="seriesTitle"></h2>
      <p class="sintro" id="seriesIntro"></p>
    </div>
    <div class="sgrid" id="seriesRows"></div>
  </div>
</section>

<!-- ============ 现场 ============ -->
<section class="sec" id="field">
  <div class="wrap">
    <div class="shead rv">
      <div class="sc"><i></i><span id="fieldSc"></span></div>
      <h2 id="fieldTitle"></h2>
      <p class="sintro" id="fieldIntro"></p>
    </div>
    <div class="expgrid">
      <div class="rv" id="evCol"></div>
      <div class="rv">
        <div class="flow">
          <h4><span class="ic">▍</span><span id="flowHead"></span></h4>
          <span class="st" id="flowKick"></span>
          <ol id="flowSteps"></ol>
        </div>
        <p class="note-sm" id="fieldNote"></p>
      </div>
    </div>
  </div>
</section>

<!-- ============ 档案 ============ -->
<section class="sec alt" id="about">
  <div class="wrap">
    <div class="shead rv">
      <div class="sc"><i></i><span id="profileSc"></span></div>
      <h2 id="profileTitle"></h2>
    </div>
    <div class="abgrid">
      <div class="portrait rv">
        <div class="ph"><img src="assets/avatar.jpg" alt="吴天豪"></div>
        <div class="cap"><b id="pfName"></b><span id="pfMeta"></span></div>
      </div>
      <div class="skl rv">
        <h3 id="pfH"></h3>
        <div class="who" id="pfWho"></div>
        <ul class="sk" id="skillsList"></ul>
        <div class="stmt" id="pfStmt"></div>
      </div>
    </div>
  </div>
</section>

<!-- ============ 联系 ============ -->
<section class="sec" id="contact" style="border-bottom:0">
  <div class="wrap">
    <div class="shead rv">
      <div class="sc"><i></i><span id="contactSc"></span></div>
      <div class="cta-big" id="contactBig"></div>
    </div>
    <div class="ccells" id="ccells"></div>
  </div>
</section>

<footer>
  <div class="wrap">
    <div id="footL"></div>
    <div id="footR"></div>
  </div>
</footer>

<script src="data.js"></script>
<script>
const D = window.SITE_DATA;
/* 轻量渲染：**x** -> <em>(标题) / <b>(正文)；\n -> <br>（仅 .cta-big 用 pre-line） */
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const md = (s, tag) => esc(s).split(/\*\*(.+?)\*\*/g).map((p,i)=> i%2 ? "<"+tag+">"+p+"</"+tag+">" : p).join("");
const txt = s => String(s);

document.title = D.page.title;
document.querySelector('meta[name="description"]').setAttribute("content", D.page.description);
document.getElementById("nbName").textContent = D.hero.name;
document.getElementById("footL").textContent = D.page.footerLeft;
document.getElementById("footR").textContent = D.page.footerRight;

/* ---- hero ---- */
document.getElementById("eyebrow").textContent = D.hero.eyebrow;
document.getElementById("heroName").textContent = D.hero.name;
document.getElementById("heroNameEn").textContent = D.hero.nameEn;
document.getElementById("deck").textContent = D.hero.deck;
document.getElementById("lead").textContent = D.hero.lead;
document.getElementById("btnMainTxt").textContent = D.hero.btnMain;
document.getElementById("btnMailTxt").textContent = D.hero.btnMail;
document.getElementById("btnMail").setAttribute("href","mailto:"+D.contact.email+"?subject="+encodeURIComponent("菲尼克斯电气 校园大使 求职 — 吴天豪"));
document.getElementById("btnBiliTxt").textContent = D.hero.btnBili.replace(/ ↗$/,"");
document.getElementById("btnBili").setAttribute("href", D.links.bili);
document.getElementById("facts").innerHTML = D.hero.facts.map(f=>`
  <div class="s"><div class="v">${esc(f.n)}${f.u?'<b>'+esc(f.u)+'</b>':''}</div><div class="l">${esc(f.l)}</div></div>`).join("");

/* ---- crew ---- */
document.getElementById("crewTag").textContent = D.crew.tag;
document.getElementById("crewHead").textContent = D.crew.head;
document.getElementById("crewRows").innerHTML = D.crew.rows.map(r=>{
  let v = esc(r.v);
  if(r.s) v += "<small>"+esc(r.s)+"</small>";
  if(r.link){ const href = r.link==="bili" ? D.links.bili : r.link; v = "<a href='"+esc(href)+"' "+(r.ext?'target="_blank" rel="noopener"':'')+">"+v+"</a>"; }
  return `<div class="cr"><div class="k">${esc(r.k)}</div><div class="v">${v}</div></div>`;
}).join("");
document.getElementById("crewFoot").innerHTML = `
  <a class="btn blue" href="mailto:${esc(D.contact.email)}?subject=${encodeURIComponent('菲尼克斯电气 校园大使 求职 — 吴天豪')}">发邮件联系我</a>
  <a class="btn line" href="${esc(D.links.biliVideos)}" target="_blank" rel="noopener">看全部内容 ↗</a>`;

/* ---- works ---- */
const mdB = s=>md(s,"b"), mdE = s=>md(s,"em");
document.getElementById("worksSc").textContent = D.works.sc;
document.getElementById("worksTitle").innerHTML = mdE(D.works.title);
document.getElementById("worksIntro").innerHTML = mdB(D.works.intro);
document.getElementById("worksMore").textContent = D.works.linkMore;
document.getElementById("worksMore").setAttribute("href", D.links.biliVideos);
document.getElementById("worksRows").innerHTML = D.works.items.map((w,i)=>`
  <a class="frow rv" href="https://www.bilibili.com/video/${esc(w.bv)}" target="_blank" rel="noopener" style="transition-delay:${(i%3)*50}ms">
    <span class="idx"><b>REC-${String(i+1).padStart(2,"0")}</b><span>${esc(w.d)}</span></span>
    <span class="fthumb"><span class="pl">▶</span><img loading="lazy" src="${w.img? "assets/"+esc(w.img) : ""}" alt="${esc(w.t)}" onload="this.classList.add('ok');this.closest('.fthumb').classList.add('on')" onerror="this.remove();this.closest('.fthumb').classList.add('on')"></span>
    <span class="fmain">
      <h3>${esc(w.t)}</h3>
      <span class="sub"><span class="t">${esc(w.tag)}</span><span>独立完成</span><span>${w.cmt} 条评论</span></span>
      <span class="fnote">${esc(w.note)}</span>
    </span>
    <span class="fmeta"><span class="pl">${esc(w.play)}<b> ▶</b></span><span class="cm">${esc(w.d)}</span></span>
  </a>`).join("");

/* ---- series ---- */
document.getElementById("seriesSc").textContent = D.series.sc;
document.getElementById("seriesTitle").innerHTML = mdE(D.series.title);
document.getElementById("seriesIntro").innerHTML = mdB(D.series.intro);
document.getElementById("seriesRows").innerHTML = D.series.items.map(s=>`
  <div class="scard rv">
    <div class="no">${esc(s.no)}<em>${esc(s.tag)}</em></div>
    <h3>${esc(s.h)}</h3>
    <span class="pill">${esc(s.pill)}</span>
    <p>${esc(s.desc)}</p>
    <div class="eps">${s.eps.map(e=>`<a href="https://www.bilibili.com/video/${esc(e.bv)}" target="_blank" rel="noopener">${esc(e.t)}<span class="pv">${esc(e.v)}</span><span class="n">▶</span></a>`).join("")}</div>
  </div>`).join("");

/* ---- field ---- */
document.getElementById("fieldSc").textContent = D.field.sc;
document.getElementById("fieldTitle").textContent = D.field.title;
document.getElementById("fieldIntro").textContent = D.field.intro;
document.getElementById("evCol").innerHTML = D.field.evs.map(ev=>`
  <div class="ev">
    <div class="top"><h4>${esc(ev.h)}<small>${esc(ev.s)}</small></h4><div class="dt">${esc(ev.d)}</div></div>
    <p>${mdB(ev.desc)}</p>
  </div>`).join("") + `<p class="note-sm">${mdB(D.field.evNote)}</p>`;
document.getElementById("flowHead").textContent = D.field.flowHead;
document.getElementById("flowKick").textContent = D.field.flowKick;
document.getElementById("flowSteps").innerHTML = D.field.flowSteps.map(st=>`<li><span class="tt">${esc(st.t)}</span><span class="ds">${esc(st.ds)}</span></li>`).join("");
document.getElementById("fieldNote").innerHTML = mdB(D.field.flowNote);

/* ---- profile ---- */
document.getElementById("profileSc").textContent = D.profile.sc;
document.getElementById("profileTitle").textContent = D.profile.title;
document.getElementById("pfName").textContent = D.profile.name;
document.getElementById("pfMeta").textContent = D.profile.meta;
document.getElementById("pfH").textContent = D.profile.h;
document.getElementById("pfWho").textContent = D.profile.who;
document.getElementById("skillsList").innerHTML = D.profile.skills.map(s=>`<li><span class="t">${esc(s.t)}</span><b>${esc(s.b)}</b></li>`).join("");
document.getElementById("pfStmt").innerHTML = mdB(D.profile.stmt);

/* ---- contact ---- */
document.getElementById("contactSc").textContent = D.contact.sc;
document.getElementById("contactBig").innerHTML = mdE(D.contact.big).replace(/\n/g,"<br>");
document.getElementById("ccells").innerHTML = `
  <a class="cc rv" href="mailto:${esc(D.contact.email)}"><span class="k">EMAIL · 推荐</span><span class="v">${esc(D.contact.email)}</span><span class="go">${esc(D.contact.emailGo)}</span></a>
  <div class="cc rv"><span class="k">PHONE</span><span class="v">${esc(D.contact.phone)}</span><span class="go">${esc(D.contact.phoneGo)}</span></div>
  <a class="cc rv" href="${esc(D.links.bili)}" target="_blank" rel="noopener"><span class="k">BILIBILI @HeilSun</span><span class="v">${esc(D.contact.biliLabel)}</span><span class="go">${esc(D.contact.biliGo)}</span></a>
  <div class="cc rv"><span class="k">LOCATION</span><span class="v">${esc(D.contact.location)}</span><span class="go">${esc(D.contact.locationGo)}</span></div>`;

/* ---- 时间码 ---- */
(function(){const el=document.getElementById("tc"),t0=Date.now();
 const pad=n=>String(n).padStart(2,"0");
 (function tick(){const d=new Date();const fr=Math.floor((Date.now()-t0)/1000*24)%24;
  el.textContent=pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds())+":"+pad(fr);
  setTimeout(tick,42);})();})();

/* ---- 显现 ---- */
const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}})},{threshold:.06});
document.querySelectorAll(".rv").forEach(el=>io.observe(el));

/* ---- 顶栏跟随 ---- */
const ln=[...document.querySelectorAll("nav .ln a")];
const map={works:"#works",series:"#series",field:"#field",about:"#about",contact:"#contact"};
const spy=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting&&map[e.target.id]){ln.forEach(l=>l.classList.toggle("on",l.getAttribute("href")===map[e.target.id]));}})},{rootMargin:"-45% 0px -50% 0px"});
Object.keys(map).forEach(id=>{const x=document.getElementById(id);if(x)spy.observe(x);});
</script>
</body>
</html>
